name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: mayaleen, POSTGRES_PASSWORD: mayaleen, POSTGRES_DB: mayaleen_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mayaleen" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mayaleen:mayaleen@localhost:5432/mayaleen_test
      DIRECT_URL: postgresql://mayaleen:mayaleen@localhost:5432/mayaleen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npx tsx prisma/seed.ts
      - run: npm run typecheck
      - run: npm test
